name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: drop-ads-sideload
          path: |
            dist/drop-ads-*-chromium.zip
            dist/drop-ads-*-firefox.xpi
          if-no-files-found: error
